<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- ✅ CDN correcto -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;padding:20px;background:#f5f5f5;}
.formulario,.resumen{background:white;padding:20px;border-radius:10px;margin-bottom:20px;}
input{width:100%;padding:10px;margin-bottom:10px;}
#map{height:300px;border-radius:10px;}
button{padding:12px;background:black;color:white;border:none;cursor:pointer;width:100%;margin-top:10px;}
.total{font-weight:bold;margin-top:10px;}
</style>

</head>

<body>

<h1>Datos de envío</h1>

<div class="formulario">

<input id="nombre" placeholder="Nombre completo">
<input id="telefono" placeholder="Teléfono">

<input id="direccionBusqueda" placeholder="Buscar dirección">
<button onclick="buscarDireccion()">Buscar</button>

<input id="ciudad" placeholder="Ciudad">
<input id="calle" placeholder="Dirección">

<div id="map"></div>

</div>

<div class="resumen">

<p>Distancia: <span id="distancia">0</span> km</p>
<p>Envío: $<span id="envio">0</span></p>

<!-- 🔥 NUEVO -->
<p>Total productos: $<span id="totalProductos">0</span></p>
<p class="total">Total final: $<span id="totalFinal">0</span></p>

<h3>Método de pago</h3>

<button onclick="pagarTransferencia()">Transferencia</button>
<button onclick="pagarPayphone()">PayPhone</button>

</div>

<script src="../services/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="checkout.js"></script>

</body>
</html>
