<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Administrador</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login{
background:white;
padding:40px;
border-radius:10px;
width:300px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
width:100%;
padding:10px;
background:black;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#333;
}

</style>

</head>

<body>

<div class="login">

<h2>Login Admin</h2>

<input type="email" id="email" placeholder="Correo">

<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">
Entrar
</button>

</div>

<script src="../services/supabase.js"></script>
<script src="login.js"></script>

</body>

</html>
